name: Update Try Omarchy
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-try-omarchy
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'ThatGuySam/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Check latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Verify candidate before publishing
        if: steps.release.outputs.changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -v
          bash scripts/verify-macos.sh
      - name: Commit verified version and checksum
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/thatguysam-try-omarchy.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(cask): update Try Omarchy to ${VERSION}"
          # Never force-push; a concurrent change must be retried on a new run.
          git push origin HEAD:main
