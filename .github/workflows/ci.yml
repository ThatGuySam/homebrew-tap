name: Validate tap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          ruby -c Casks/thatguysam-try-omarchy.rb
          for script in scripts/*.sh; do bash -n "$script"; done
  macos-package:
    needs: tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify packaging on Apple Silicon (no VM boot)
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: bash scripts/verify-macos.sh
